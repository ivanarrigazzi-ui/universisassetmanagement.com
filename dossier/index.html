<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Corporate Presentation 2026 · Universis Asset Management</title>
<link rel="icon" href="../img/u.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:124px}
  body{background:#0a0c0d;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* barra */
  .bar{position:fixed;z-index:5;top:0;left:0;right:0;height:104px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3.2vw;
       background:rgba(10,12,13,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
  .bar .logo img{display:block;width:44px;height:auto}
  .bar .tt{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:rgba(255,255,255,.75);white-space:nowrap}
  .bar .r{justify-self:end;display:flex;align-items:center;gap:22px}
  .lang{position:relative}
  .lang > button{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid transparent;background:none;color:#fff;cursor:pointer;font-family:inherit;
                 font-size:9.5px;letter-spacing:.24em;font-weight:400;opacity:.85;transition:opacity .2s,border-color .2s}
  .lang > button:hover,.lang.open > button{opacity:1;border-color:rgba(255,255,255,.25)}
  .lang > button svg{width:8px;height:8px;transition:transform .2s}
  .lang.open > button svg{transform:rotate(180deg)}
  .lang ul{position:absolute;right:0;top:calc(100% + 6px);min-width:150px;list-style:none;background:rgba(8,10,11,.96);border:1px solid rgba(255,255,255,.16);
           padding:6px 0;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s,transform .2s,visibility .2s}
  .lang.open ul{opacity:1;visibility:visible;transform:none}
  .lang li button{display:flex;width:100%;justify-content:space-between;gap:18px;padding:9px 16px;background:none;border:0;color:rgba(255,255,255,.7);cursor:pointer;
                  font-family:inherit;font-size:11px;font-weight:300;letter-spacing:.04em;text-align:left}
  .lang li button span{font-size:9px;letter-spacing:.22em;color:rgba(255,255,255,.4)}
  .lang li button:hover{background:rgba(255,255,255,.07);color:#fff}
  .lang li button.on,.lang li button.on span{color:#fff}
  .exit{display:inline-block;padding:9px 16px;border:1px solid rgba(255,255,255,.55);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s}
  .exit:hover{background:#fff;color:#000;border-color:#fff}

  /* diapositivas */
  main{padding:148px 3.2vw 90px}
  .slides{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
  .slide{position:relative;aspect-ratio:16/9;background:#15181a;box-shadow:0 2px 4px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.45)}
  .slide img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
  .slide img.ok{opacity:1}

  .count{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;white-space:nowrap}
  .end{max-width:1320px;margin:46px auto 0;display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);
       font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.5);font-weight:300}

  @media (max-width:760px){
    html{scroll-padding-top:90px}
    .bar{height:76px;grid-template-columns:auto 1fr;padding:0 16px}
    .bar .logo img{width:36px}
    .bar .tt{display:none}
    .bar .r{gap:14px}
    .exit{padding:7px 11px;font-size:8.5px;letter-spacing:.18em}
    main{padding:96px 10px 70px}
    .slides{gap:14px}
    .count{display:none}
    .end{flex-direction:column;align-items:flex-start;gap:6px;font-size:9.5px}
  }
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="../" aria-label="Universis Asset Management"><img src="../img/logo-blanco.png" alt="Universis Asset Management"></a>
  <div class="tt" id="tt">Corporate Presentation 2026</div>
  <div class="r">
    <span class="count" id="count">1 / 104</span>
    <div class="lang" id="lang">
      <button type="button" id="langBtn" aria-haspopup="listbox" aria-expanded="false"><b id="langCur" style="font-weight:400">EN</b>
        <svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.4"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg></button>
      <ul role="listbox" id="langList"></ul>
    </div>
    <a class="exit" id="exit" href="../">Exit</a>
  </div>
</header>

<main>
  <section class="slides" id="slides"></section>
  <div class="end"><span>© 2026 Universis Asset Management</span><a href="mailto:info@universisassetmanagement.com">info@universisassetmanagement.com</a></div>
</main>

<script>
(() => {
  const N = 104;
  const T = {
    en:{name:'English', tt:'Corporate Presentation 2026', exit:'Exit'},
    es:{name:'Español', tt:'Presentación corporativa 2026', exit:'Salir'}
  };
  const ES = 'ES AR MX CL CO PE UY PY BO EC VE CR PA DO GT HN SV NI CU PR GQ'.split(' ');
  const store = { get(){ try { return localStorage.getItem('uam-lang'); } catch(e){ return null; } },
                  set(v){ try { localStorage.setItem('uam-lang', v); } catch(e){} } };
  const box = document.getElementById('slides'), cnt = document.getElementById('count');
  let lang = null, current = 1;

  function build(l){
    if (l === lang) return;
    lang = l; const t = T[l];
    document.documentElement.lang = l;
    document.title = t.tt + ' · Universis Asset Management';
    document.getElementById('tt').textContent = t.tt;
    document.getElementById('exit').textContent = t.exit;
    document.getElementById('langCur').textContent = l.toUpperCase();
    document.querySelectorAll('#langList button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
    const keep = current;
    box.innerHTML = '';
    for (let i = 1; i <= N; i++){
      const n = String(i).padStart(3, '0');
      const d = document.createElement('div'); d.className = 'slide'; d.id = 's' + i; d.dataset.i = i;
      const im = new Image(); im.alt = `${i} / ${N}`; im.decoding = 'async'; im.loading = i <= 3 ? 'eager' : 'lazy';
      im.onload = () => im.classList.add('ok'); im.src = `../${l}/${n}.webp`;
      d.appendChild(im); box.appendChild(d); io.observe(d);
    }
    if (keep > 1) document.getElementById('s' + keep).scrollIntoView({behavior:'instant'});
  }

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ current = +e.target.dataset.i; cnt.textContent = `${current} / ${N}`; }
  }), {rootMargin:'-45% 0px -45% 0px'});

  /* selector de idioma (desplegable; de momento el dossier existe en EN y ES) */
  const lb = document.getElementById('lang'), lbtn = document.getElementById('langBtn'), lul = document.getElementById('langList');
  lul.innerHTML = Object.keys(T).map(k => `<li><button type="button" role="option" data-l="${k}">${T[k].name}<span>${k.toUpperCase()}</span></button></li>`).join('');
  const toggle = o => { lb.classList.toggle('open', o); lbtn.setAttribute('aria-expanded', o); };
  lbtn.addEventListener('click', e => { e.stopPropagation(); toggle(!lb.classList.contains('open')); });
  lul.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; store.set(b.dataset.l); build(b.dataset.l); toggle(false); });
  document.addEventListener('click', e => { if (!lb.contains(e.target)) toggle(false); });

  /* flechas / espacio: diapositiva siguiente o anterior */
  document.addEventListener('keydown', e => {
    const k = e.key; let to = null;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) to = Math.min(N, current + 1);
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey)) to = Math.max(1, current - 1);
    if (k === 'Home') to = 1; if (k === 'End') to = N;
    if (to !== null){ e.preventDefault(); document.getElementById('s' + to).scrollIntoView({behavior:'smooth'}); }
  });

  /* idioma: ?lang=es|en > elección guardada > país por IP > navegador */
  const qs = new URLSearchParams(location.search).get('lang');
  const saved = store.get();
  const pick = v => (v === 'es' ? 'es' : v === 'en' ? 'en' : null);
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase() === 'es' ? 'es' : 'en';
  build(pick(qs) || pick(saved) || nav);
  if (pick(qs) || pick(saved)) return;
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2000);
  fetch('https://api.country.is/', {signal: ctl.signal}).then(r => r.json())
    .then(d => build(ES.includes(String(d.country || '').toUpperCase()) ? 'es' : 'en'))   // manda el país del visitante (IP).catch(() => {});
})();
</script>
</body>
</html>
