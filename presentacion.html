<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporate Presentation · Universis Asset Management</title>
<link rel="icon" href="img/u.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="viewer">
<header class="top">
  <a class="brand" href="./" aria-label="Universis Asset Management">
    <img src="img/u.png" alt="">
    <span class="wm"><b>Universis</b><i>Asset Management</i></span>
  </a>
  <div class="vbar">
    <span class="lang"><a id="l-en" href="?lang=en">EN</a> · <a id="l-es" href="?lang=es">ES</a></span>
    <a class="dl" id="dl" href="#" download>Download PDF</a>
  </div>
</header>
<section class="vhead">
  <h1 id="tt">Corporate Presentation 2026</h1>
  <p id="st">Universis Asset Management</p>
</section>
<section class="slides" id="slides"></section>
<footer class="foot">
  <span>Madrid · Luxembourg · Santo Domingo · Mexico City</span>
  <a href="mailto:info@universisassetmanagement.com">info@universisassetmanagement.com</a>
</footer>
<script>
(() => {
  const N = 104;
  const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
  document.documentElement.lang = lang;
  document.getElementById('l-' + lang).classList.add('on');
  const T = {
    en: {tt:'Corporate Presentation 2026', dl:'Download PDF', conf:'Confidential — for professional investors only · © 2026 Universis Asset Management',
         pdf:'pdf/Universis-Asset-Management-Corporate-Presentation-2026-EN.pdf'},
    es: {tt:'Presentación corporativa 2026', dl:'Descargar PDF', conf:'Confidencial — solo para inversores profesionales · © 2026 Universis Asset Management',
         pdf:'pdf/Universis-Asset-Management-Presentacion-Corporativa-2026-ES.pdf'}
  }[lang];
  document.getElementById('tt').textContent = T.tt;
  document.title = T.tt + ' · Universis Asset Management';
  const dl = document.getElementById('dl'); dl.textContent = T.dl; dl.href = T.pdf;
  const box = document.getElementById('slides');
  for (let i = 1; i <= N; i++){
    const n = String(i).padStart(3, '0');
    const d = document.createElement('div'); d.className = 'slide';
    d.innerHTML = `<img src="${lang}/${n}.webp" alt="${i}" loading="${i <= 3 ? 'eager' : 'lazy'}" decoding="async"><span>${i} / ${N}</span>`;
    box.appendChild(d);
  }
})();
</script>
</body>
</html>
